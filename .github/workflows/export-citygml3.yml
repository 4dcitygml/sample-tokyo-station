name: export CityGML 3 derivative

on:
  workflow_dispatch:
    inputs:
      dataset_dir:
        description: 'CityGML dataset directory below the repository root'
        required: true
        default: '13101_chiyoda-ku_pref_2023_citygml_1_op'
        type: string
      tools_ref:
        description: '4dcitygml/tools release tag or commit (use main only during PoC)'
        required: true
        default: 'main'
        type: string
      accept_provisional_i4dur:
        description: 'Generate a PoC artifact with the provisional i4d-UR namespace'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  convert:
    if: inputs.accept_provisional_i4dur
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical CityGML 2 data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: data

      - name: Check out pinned converter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: 4dcitygml/tools
          ref: ${{ inputs.tools_ref }}
          path: tooling

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned XML dependency
        run: python -m pip install --disable-pip-version-check 'lxml==6.1.1'

      - name: Download and verify citygml-tools 2.5.0
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://github.com/citygml4j/citygml-tools/releases/download/v2.5.0/citygml-tools-2.5.0.zip \
            -o citygml-tools.zip
          echo 'bb2949fbc6c3ec44ec85c25a0bcdfe9accde9cbdb9e26ec773889779694710b1  citygml-tools.zip' | sha256sum -c -
          unzip -q citygml-tools.zip

      - name: Convert every building GML without changing the canonical source
        shell: bash
        env:
          DATASET_DIR: ${{ inputs.dataset_dir }}
        run: |
          source_root="data/$DATASET_DIR"
          test -d "$source_root/udx/bldg"
          output_root="derived/$DATASET_DIR"
          repeat_root="repeat/$DATASET_DIR"
          mkdir -p "$output_root/codelists/i4d-ur" "$repeat_root/codelists/i4d-ur"
          cp -R "$source_root/codelists/." "$output_root/codelists/"
          cp -R "$source_root/codelists/." "$repeat_root/codelists/"
          cp tooling/schemas/i4dur/1.0/codelists/LegacyIUR3Attribute_key.xml "$output_root/codelists/i4d-ur/"
          cp tooling/schemas/i4dur/1.0/codelists/LegacyIUR3Attribute_key.xml "$repeat_root/codelists/i4d-ur/"
          mkdir -p "$output_root/schemas/i4dur/1.0"
          cp tooling/schemas/i4dur/1.0/i4dUR.xsd "$output_root/schemas/i4dur/1.0/"

          while IFS= read -r -d '' source; do
            relative="${source#"$source_root/"}"
            first="$output_root/$relative"
            second="$repeat_root/$relative"
            mkdir -p "$(dirname "$first")" "$(dirname "$second")"
            python tooling/scripts/convert_citygml2_to3_iur4.py convert \
              "$source" "$first" --citygml-tools "$PWD/citygml-tools-2.5.0/citygml-tools"
            python tooling/scripts/convert_citygml2_to3_iur4.py convert \
              "$source" "$second" --citygml-tools "$PWD/citygml-tools-2.5.0/citygml-tools"
            cmp "$first" "$second"
          done < <(find "$source_root/udx/bldg" -maxdepth 1 -type f -name '*.gml' -print0 | sort -z)

          git -C tooling rev-parse HEAD > "$output_root/converter-commit.txt"
          printf '%s\n' 'PROVISIONAL: not a canonical dataset; do not edit or publish.' > "$output_root/README.txt"

      - name: Upload the generated derivative only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: citygml3-iur4-provisional
          path: derived/
          retention-days: 7
          if-no-files-found: error
