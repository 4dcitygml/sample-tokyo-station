#
# When main is updated and when a PR is updated, check whether the PR contains the latest version.
# PR code is neither checked out nor executed; only GitHub API SHA comparison and comment updates are
# performed, by .github/scripts/base_freshness.py read from the default branch.

name: PR Base Freshness Comment

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual run checks every open PR, like a push (also while CITYGML_CI is off).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One queue for the repository: a push run updates every open PR's notice, so it must not
  # run beside a PR's own run and post the same notice twice.
  group: pr-base-freshness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  comment:
    # CI switch: the repository variable CITYGML_CI set to `off` skips automatic runs
    # (city-template docs/operator-handbook.md 6.8); a manual dispatch still runs.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Never check out the event's PR head; the script comes from the default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check open PRs and update friendly guidance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/base_freshness.py
