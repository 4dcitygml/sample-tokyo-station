# Copyright (c) 2026 4dcitygml
#
# CityGML PR comment posting workflow (the "posting" side of the two-workflow scheme).
# It fetches the artifact uploaded by pr-analysis.yml (analysis, untrusted, read-only) in the
# trusted workflow_run context (base repo, pull-requests:write) and upserts up to 11 kinds of
# comments. This enables comment posting even for fork PRs (the standard pattern to work
# around the 403 constraint that the pull_request GITHUB_TOKEN is read-only on forks and
# cannot comment).
#
# Security:
#   - PR code is neither checked out nor executed. Artifact Markdown and structured JSON are treated only as data.
#   - GITHUB_TOKEN sends the body via @file, so the content is never evaluated as shell/code.
#   - The PR number carried by the artifact is accepted only after its head SHA and
#     head repository match this workflow_run and the current GitHub API record.
#   - Artifact filenames, sizes, and comment markers are fixed here; untrusted
#     artifact data cannot select another bot comment to overwrite.
#
# Note: workflow_run only fires for workflow definitions on the default branch (place this on main of the public repo).

name: PR Comment (CityGML)

on:
  workflow_run:
    workflows: ["PR Analysis (CityGML)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      analysis_run_id:
        description: Completed PR analysis run to publish again
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

concurrency:
  # Serialize report publications for this repository (do not cancel older runs; let them finish posting).
  group: pr-comment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  comment:
    # Only handle runs triggered by PRs (ignore push etc.).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve the source analysis run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RUN: ${{ github.event.workflow_run.id || inputs.analysis_run_id }}
        run: |
          set -euo pipefail
          [[ "$ANALYSIS_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANALYSIS_RUN" > /tmp/report-analysis-run.json
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/report-analysis-run.json').read_text())
          if run.get('event') != 'pull_request' or run.get('path', '').split('@')[0] != '.github/workflows/pr-analysis.yml' or run.get('status') != 'completed':
              raise SystemExit('Not a completed PR analysis run')
          target = Path(os.environ['RUNNER_TEMP']) / 'citygml-report-event.json'
          target.write_text(json.dumps({'workflow_run': run}))
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"REPORT_EVENT_PATH={target}\n")
              out.write(f"RUN_HEAD_SHA={run['head_sha']}\n")
              out.write(f"RUN_HEAD_REPO={run['head_repository']['full_name']}\n")
          PYCODE

      - name: Download analysis artifact
        id: dl
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-comments
          path: out
          run-id: ${{ github.event.workflow_run.id || inputs.analysis_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post / update comments (upsert by marker)
        if: steps.dl.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/pr.txt ]; then
            echo "No pr.txt. Nothing to post."; exit 0
          fi
          PR="$(cat out/pr.txt)"
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number in the analysis artifact."
            exit 1
          fi

          pr_meta="$(gh api "repos/${REPO}/pulls/${PR}")"
          api_state="$(jq -r '.state' <<<"$pr_meta")"
          api_head_sha="$(jq -r '.head.sha' <<<"$pr_meta")"
          api_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_meta")"
          if [[ "$api_state" != "open" || "$api_head_sha" != "$RUN_HEAD_SHA" || "$api_head_repo" != "$RUN_HEAD_REPO" ]]; then
            echo "::error::Artifact metadata does not match the open PR that triggered this workflow run."
            exit 1
          fi

          allowed='^(inspection\.json|pr\.txt|commit-scope\.md|preview\.md|summary\.md|lint\.md|citygml_lint\.md|plateau_lint\.md|val3dity\.md|metadata\.md|commit\.md|inspection\.md|resubmission\.md|reproduction\.md)$'
          if find out -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not accepted in the analysis artifact."
            exit 1
          fi
          while IFS= read -r file; do
            name="${file#out/}"
            if [[ "$name" == */* ]] || ! [[ "$name" =~ $allowed ]]; then
              # A newer analysis workflow (from a PR branch) may upload files this trusted
              # side (from main) does not know yet. They are dropped, never posted, and
              # the run goes on with the files it knows — so a CI change lands trusted
              # side first without a red run in between.
              echo "::warning::Ignoring an artifact file this poster does not know: $file"
              rm -f -- "$file"
              continue
            fi
            size="$(wc -c < "$file")"
            if [ "$size" -gt 4194304 ]; then
              echo "::error::Artifact file is too large to post safely: $file"
              exit 1
            fi
            if [[ "$file" == *.md ]] && [ "$size" -gt 60000 ]; then
              # Bulk PRs (source baselines, annual source updates) legitimately produce
              # long reports. GitHub rejects comment bodies over 65,536 characters, so
              # keep the leading part (marker line first), close a dangling code fence,
              # and point at the full report in the artifact instead of failing the run.
              head -c 60000 "$file" | sed '$d' > "$file.trunc"
              if [ $(( $(grep -c '^```' "$file.trunc") % 2 )) -eq 1 ]; then printf '```\n' >> "$file.trunc"; fi
              printf '\n<sub>⚠️ Truncated to fit the GitHub comment size limit; the full report is in the pr-comments artifact of this workflow run.</sub>\n' >> "$file.trunc"
              mv "$file.trunc" "$file"
              echo "truncated for posting: ${file} (${size} bytes)"
            fi
          done < <(find out -type f -print)

          # Stamp publication context, without evaluating any artifact as code.
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          d = json.loads(Path("out/inspection.json").read_text())
          fingerprint = hashlib.sha256(json.dumps(d["context"], sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode()).hexdigest()
          event = json.loads(Path(os.environ["REPORT_EVENT_PATH"]).read_text())["workflow_run"]
          stamp = f"<!-- citygml-ci-context:{fingerprint}:{event['id']}:{event.get('run_attempt', 1)} -->"
          for p in Path("out").glob("*.md"):
              with p.open("a") as f:
                  f.write("\n" + stamp + "\n")
          PYCODE

          # Find an existing comment by a trusted, fixed marker; PATCH if found, POST otherwise.
          upsert() {
            local file="$1"
            local marker="$2"
            [ -f "$file" ] || return 0
            local existing
            if [ "$(head -n1 "$file")" != "$marker" ]; then
              echo "::error::Unexpected comment marker in $file"
              exit 1
            fi
            existing=$(gh api "repos/${REPO}/issues/${PR}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"${marker}\")) | .id" 2>/dev/null | head -1 || true)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@"$file" >/dev/null
              echo "updated: ${file} (comment ${existing})"
            else
              gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@"$file" >/dev/null
              echo "created: ${file}"
            fi
          }

          # Upsert each comment independently (only those that exist; mutually non-destructive).
          upsert out/commit-scope.md '<!-- citygml-commit-scope -->'
          upsert out/preview.md '<!-- cesium-building-preview -->'
          upsert out/summary.md '<!-- citygml-change-summary -->'
          upsert out/lint.md '<!-- citygml-reviewability-lint -->'
          upsert out/citygml_lint.md '<!-- citygml-quality-lint -->'
          upsert out/plateau_lint.md '<!-- plateau-quality-lint -->'
          upsert out/val3dity.md '<!-- val3dity-topology-gate -->'
          upsert out/metadata.md '<!-- citygml-metadata -->'
          upsert out/reproduction.md '<!-- citygml-bulk-reproduction -->'
          upsert out/commit.md '<!-- citygml-suggested-commit -->'
          # The list of all checks and the auto-resubmission state (active/resolved) also update the same comments.
          upsert out/inspection.md '<!-- citygml-automatic-inspection -->'
          upsert out/resubmission.md '<!-- citygml-auto-resubmission -->'

      - name: Publish the versioned machine report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_review_report.py
