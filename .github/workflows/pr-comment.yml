#
# CityGML PR comment posting workflow (the "posting" side of the two-workflow scheme).
# It fetches the artifact uploaded by pr-analysis.yml (analysis, untrusted, read-only) in the
# trusted workflow_run context (base repo, pull-requests:write) and upserts the comments it
# carries. This enables comment posting even for fork PRs (the standard pattern to work
# around the 403 constraint that the pull_request GITHUB_TOKEN is read-only on forks and
# cannot comment). The logic lives in .github/scripts/post_comments.py and
# .github/scripts/publish_review_report.py, read from the default branch.
#
# Security:
#   - PR code is neither checked out nor executed. Artifact Markdown and structured JSON are treated only as data.
#   - The PR number carried by the artifact is accepted only after its head SHA and
#     head repository match the analysis run and the current GitHub API record.
#   - Artifact filenames, sizes, and comment markers are fixed in post_comments.py; untrusted
#     artifact data cannot select another bot comment to overwrite.
#
# Note: workflow_run only fires for workflow definitions on the default branch (place this on main of the public repo).

name: PR Comment (CityGML)

on:
  workflow_run:
    workflows: ["PR Analysis (CityGML)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      analysis_run_id:
        description: Completed PR analysis run to publish again
        required: true
        type: string

permissions:
  contents: read
  actions: write        # re-runs an analysis whose inspection describes an older PR state
  pull-requests: write
  checks: write

concurrency:
  # One queue per analysed head (a manual run: per requested run). GitHub keeps one pending
  # run per group, so a repository-wide group let a third completion cancel another PR's
  # pending report. Runs of the same head still queue; older ones finish posting.
  group: pr-comment-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_sha || inputs.analysis_run_id }}
  cancel-in-progress: false

jobs:
  comment:
    # Only runs triggered by PRs (ignore push etc.), and only those that ran to the end:
    # a cancelled analysis (superseded by a newer run, or stopped by a person) has no result to publish.
    # CITYGML_CI set to `off` skips automatic runs (city-template docs/operator-handbook.md 6.8).
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.CITYGML_CI != 'off' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      ANALYSIS_RUN: ${{ github.event.workflow_run.id || inputs.analysis_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download analysis artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-comments
          path: out
          run-id: ${{ env.ANALYSIS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post the detail comments and the versioned machine report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/post_comments.py
