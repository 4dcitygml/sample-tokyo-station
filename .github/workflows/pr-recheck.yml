# Re-run the existing read-only PR analysis when the submitter or a maintainer requests a re-inspection from the hub.
# PR code is neither checked out nor executed in this trusted workflow; .github/scripts/recheck_analysis.py
# is read from the default branch.
name: PR Analysis recheck request

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  # The replies go to pull requests (the job runs only for issue comments on a PR);
  # commenting on a PR through the issues API needs pull-requests: write, not issues: write.
  pull-requests: write

concurrency:
  group: pr-recheck-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  recheck:
    # CITYGML_CI set to `off` skips automatic runs (city-template docs/operator-handbook.md 6.8).
    if: >-
      vars.CITYGML_CI != 'off' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- citygml-ci-retry-request -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Authorize request and rerun current PR analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/recheck_analysis.py
