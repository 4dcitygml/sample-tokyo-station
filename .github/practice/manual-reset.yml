#
# Manual practice reset — by pull request, never by force-push.
#
# An operator dispatches this workflow (typing RESET). It pushes a branch reset/<date>
# from main holding ONE commit that returns the city's data directories (data_dirs in
# 4dcitygml.json, plus provenance/ where present) to exactly what the `baseline` branch
# holds, and changes nothing outside them (workflows, documents and configuration stay
# as they are on main). History is kept, nothing is rewritten. The run's summary links
# the pull request to open; the operator opens it, so the checks start as for any pull
# request, and merges it when they are green. The tools' commit-scope gate verifies the
# data blob ids against the Reset-To commit (Change-Type: practice-reset), so the reset
# can neither smuggle nor miss a change.
#
# The merge's push to main starts the second job: it closes the open proposals that
# change nothing but the data directories, with a note in the city's language
# (texts.py); other pull requests stay open.
#
# Practice cities only: this file lives in the template's .github/practice/ folder and
# is copied into .github/workflows/ by a practice city (.github/practice/README.md).
#
# Requirements:
#   - a `baseline` branch holding the pristine practice data (re-cut only when the
#     data itself changes; it need not track workflows or documents)
#   - repository variable PRACTICE_REPO = this repository's owner/name
#   - GITHUB_TOKEN only; no personal token, no RESET_TOKEN secret.

name: Manual practice reset

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET to push a branch that returns main to baseline'
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reset:
    # Fail-closed guard: runs only where the PRACTICE_REPO repository variable is set
    # to this repo's own owner/name (forks and copies do not have it -> inert).
    if: >-
      github.repository == vars.PRACTICE_REPO &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RESET'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: manual-reset
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Push the reset branch (one commit, data directories = baseline)
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin baseline main
          BASELINE="$(git rev-parse origin/baseline)"
          MAIN="$(git rev-parse origin/main)"
          DIRS=()
          while IFS= read -r d; do DIRS+=("$d"); done < <(python3 .github/practice/practice_reset.py dirs)
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo "::error::4dcitygml.json declares no data_dirs; nothing to reset."
            exit 1
          fi
          echo "data directories: ${DIRS[*]}"
          data_listing() { git ls-tree -r "$1" -- "${DIRS[@]}" 2>/dev/null || true; }
          if [ "$(data_listing "$MAIN")" = "$(data_listing "$BASELINE")" ]; then
            echo "main already holds the baseline data; nothing to reset."
            echo "main already holds the baseline data; nothing to reset." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="reset/$(date -u +%F)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH="${BRANCH}-$(date -u +%H%M%S)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH" "$MAIN"
          # Replace only the data directories with baseline's content; everything else stays main's.
          for d in "${DIRS[@]}"; do
            git rm -r --quiet --ignore-unmatch -- "$d"
            if git cat-file -e "${BASELINE}:${d}" 2>/dev/null; then
              git checkout "$BASELINE" -- "$d"
            fi
          done
          printf 'Reset practice data to baseline\n\nChange-Type: practice-reset\nReset-To: %s\n' "$BASELINE" > "$RUNNER_TEMP/reset-message.txt"
          git commit -q -F "$RUNNER_TEMP/reset-message.txt"
          # Self-check, the same two conditions the tools' commit-scope gate verifies.
          if [ "$(data_listing HEAD)" != "$(data_listing "$BASELINE")" ]; then
            echo "::error::The reset commit does not hold the baseline data exactly."
            exit 1
          fi
          inside() { local d; for d in "${DIRS[@]}"; do [[ "$1" == "$d/"* ]] && return 0; done; return 1; }
          outside="$(git diff --name-only --no-renames "$MAIN" HEAD | while IFS= read -r f; do inside "$f" || echo "$f"; done)"
          if [ -n "$outside" ]; then
            echo "::error::The reset commit changes paths outside the data directories: ${outside}"
            exit 1
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "reset branch ${BRANCH}: data directories of main ${MAIN} -> those of baseline ${BASELINE}"
          # The operator opens the pull request: one opened by the workflow token would start
          # no checks. The link fills in the title and the reason section the analysis reads.
          TITLE="Reset practice data to baseline ($(date -u +%F))"
          cat > "$RUNNER_TEMP/reset-body.md" <<BODY
          ## Summary of changes <!--sec:reason-->

          This pull request returns the city's data directories to their baseline, commit \`${BASELINE}\` (branch \`baseline\`), and changes nothing outside them. History is kept: the previous state of main (\`${MAIN}\`) stays in the log, nothing is rewritten and main is never force-pushed.

          The commit carries \`Change-Type: practice-reset\` and \`Reset-To: ${BASELINE}\`; the analysis verifies that the data directories are exactly those of the baseline commit and that nothing else changed. When it is merged, the open proposals that change nothing but the data directories are closed with a note.
          BODY
          LINK="$(python3 -c 'import sys, urllib.parse as u; print(sys.argv[1] + "?" + u.urlencode({"quick_pull": 1, "title": sys.argv[2], "body": open(sys.argv[3]).read().strip()}))' \
            "https://github.com/${REPO}/compare/main...${BRANCH}" "$TITLE" "$RUNNER_TEMP/reset-body.md")"
          {
            echo "## Practice reset: open the pull request"
            echo
            echo "[Open the reset pull request](${LINK}) (\`${BRANCH}\` into main), then merge it when \`analyze\` and \`ci-report\` are green. The merge closes the open data proposals."
          } >> "$GITHUB_STEP_SUMMARY"

  close-proposals:
    # The merged reset: its commit carries the trailer the commit-scope gate verified.
    if: >-
      github.repository == vars.PRACTICE_REPO &&
      github.event_name == 'push' &&
      contains(join(github.event.commits.*.message, ' '), 'Change-Type: practice-reset')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Close open data proposals with a note
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/practice/practice_reset.py close
